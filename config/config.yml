# All records are fictional. Paths are relative to the repository root.
data_kind: synthetic
data_parameters:
  - path: examples/synthetic_survey.csv
target:
  - would_recommend
filters:
  - dropna_on_target
filters_params:
  dropna_on_target:
    columns: would_recommend
pipeline_steps_names:
  - numeric
  - categorical
pipeline_steps:
  - NumericPreprocessor
  - CategoricalPreprocessor
pipeline_steps_params:
  - {}
  - {}
pipeline_steps_columns:
  - numeric
  - categorical
pipeline_steps_type:
  - transformer
  - transformer
models:
  - DummyClassifier
  - LogisticRegression
  - RandomForestClassifier
models_params:
  - strategy: most_frequent
  - max_iter: 1000
    random_state: 42
  - n_estimators: 100
    max_depth: 6
    random_state: 42
    n_jobs: 1
